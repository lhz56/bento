name: Bento
options:
  bundleIdPrefix: dev.bento
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ZX6ABY8QF9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Bento:
    type: application
    platform: iOS
    sources: [Bento]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bento.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Bento/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Bento/Info.plist
      properties:
        # "Bento" alone is another App Store app's name, and Apple rejects a build that uses it (ITMS-90129)
        CFBundleDisplayName: Bento Code
        CFBundleName: Bento Code
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Paper
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSCameraUsageDescription: Bento uses the camera only to scan the pairing code on your Mac.
        NSLocalNetworkUsageDescription: Bento Code finds Bento on your Mac over your Wi-Fi, where the work happens.
        NSBonjourServices: [_bento._tcp]
        ITSAppUsesNonExemptEncryption: false
        # Bento talks only to the user's own Mac, by its Tailscale name or private Wi-Fi address, over plain HTTP
        # (Tailscale encrypts it end to end). There's no public server to put a certificate on. Every request after
        # pairing carries the device's own key, and the Mac only answers devices it paired (electron/host.cjs).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
