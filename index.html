<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Only Bento's own files run here: no eval, no inline scripts, no other sites. Lesson pages run on play:// in a frame;
       lesson code runs in workers. `npm run dev` adds the development server's addresses (vite.config.js). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; frame-src play:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Bento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
