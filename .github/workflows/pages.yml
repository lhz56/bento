name: site
# Publishes https://takeitapart.app (GitHub Pages) whenever it changes on main: the site from site/, and Bento itself
# in the browser at /try (npm run build:web, src/web.js).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'public/**', 'index.html', 'vite.config.js', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # only the web page is built here
      - run: npm run build:web
      - name: Put the site and /try together
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R dist-web _site/try
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
