name: release
# Push a tag like v0.3.0 and this builds Bento for Apple Silicon and Intel, signs it with your Developer ID,
# notarizes it with Apple, and attaches the .dmg, .zip and latest-mac.yml to a GitHub release.
# Copies of Bento already installed find the new version from latest-mac.yml and update themselves.
# Nothing runs until the secrets below exist (see docs/RELEASING.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its files

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Logic tests
        run: npm test
      - name: Release preflight (config, entitlements, fuses)
        run: node scripts/check-release.mjs --quick
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Put the notarization key on disk
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
      - name: Build, sign, notarize and publish
        run: npm run release -- -c.releaseInfo.releaseNotesFile="$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate, exported from Keychain as .p12, then base64-encoded
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # App Store Connect API key for notarization (Users and Access → Integrations → Team Keys)
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check the signature and notarization
        run: |
          for app in release/mac*/Bento.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done
