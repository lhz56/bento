name: Something's broken
description: Bento did something wrong or didn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bento version
      description: Bento → About Bento, or Settings.
      placeholder: "0.3.2"
  - type: dropdown
    id: ai
    attributes:
      label: Which AI were you using?
      options: [Claude, ChatGPT (Codex), Gemini, Copilot, None yet, Not sure]
  - type: input
    id: mac
    attributes:
      label: Mac
      description: macOS version, and Apple Silicon or Intel.
      placeholder: "macOS 15.2, Apple Silicon"
  - type: input
    id: repo
    attributes:
      label: GitHub link (if it was taking a repo apart)
